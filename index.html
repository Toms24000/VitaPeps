h1{font-size:22px;font-weight:900;margin:4px 0 10px}

.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 2px 0 var(--line)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.date{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;color:var(--tx);background:var(--pri2);padding:9px 14px}

.msg{margin-top:10px;font-weight:900;text-align:center;background:var(--pri2);border-radius:14px;padding:8px}

.item .x{background:none;padding:4px 8px;color:var(--mut)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}

label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

function okT(){TM=tmin();$("#am").value=TM;$("#awl").textContent="⏱ "+(TM?Math.floor(TM/60)+" h "+String(TM%60).padStart(2,"0"):"Choisir le temps passé");closeM();spPrev()}

='http://www.w3.org/2000/svg' viewBox='0 -10 120 130' role='img' aria-label='Peps, ta mascotte'>${ruff}<path d='M28 44L24 4Q42 6 54 30Z' fill='#b87333'/><path d='M32 36L30 15Q39 17 47 29Z' fill='#e8b4a0'/><path d='M92 44L96 4Q78 6 66 30Z' fill='#b87333'/><path d='M88 36L90 15Q81 17 73 29Z' fill='#e8b4a0'/><ellipse cx='60' cy='64' rx='35' ry='32' fill='#c98a45'/><path d='M42 68Q60 60 78 68Q80 92 60 101Q40 92 42 68Z' fill='#f1d7ab'/><path d='M33 42Q60 34 87 42L86 48Q60 41 34 48Z' fill='#b91c1c'/><path d='M87 43l13-4-3 10z' fill='#b91c1c'/>${eyes}${brows}<ellipse cx='60' cy='80' rx='7.5' ry='5' fill='#1a1210'/><ellipse cx='58' cy='78.5' rx='2.2' ry='1.2' fill='#fff' opacity='.5'/>${mouth}${fx}</svg>`}

 const k=key(new Date()),all=sum(MEALS.flatMap(m=>entries(k)[m[0]])),G=S.goals,bu=burned(k),left=Math.round(G.k-all.k+bu),pct=G.k?all.k/G.k:0,wa=S.water[k]||0,st=S.steps[k]||0;
